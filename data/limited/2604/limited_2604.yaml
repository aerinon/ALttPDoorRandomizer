text:
    # custom texts
    'shop_fortune_teller_lw_hint_0': "A new harmony flows from the flute, calling you fourth to distant lands"
    'kiki_first_extortion': "OoOo, banana! Gimme 10 bananas and I'll help you out."
    'lost_woods_thief': "I've been hearing a rustling up in the rafters.\nBut I'm too lazy to do anything about it."
    'limited_run_message_0': "{NOBORDER}\nThe heck was that? There's gotta be something around here that we can throw at that thing before we jump in."
    'ganon_phase_3': "You'll never throw me outta here!"
    'sign_rain_north_of_links_house': "Historical Note: Of all the sages, Logi was considered the most formidable in direct combat — a warrior first, scholar second."
    'sign_north_of_links_house': "Magical Resonance: The crystals emit a faint humming sound that varies in pitch based on the maiden's emotional state."
    'sign_path_to_death_mountain': "Structural Survey: A compromised section of masonry within the Ice Palace may conceal the mechanism."
    'sign_lost_woods': "Genealogical Note: Hadah's rival's descendant bears a name beginning with 'E' and ending with 'a'."
    'sign_zoras': "Disputed Attribution: Eurus and Ibai each commanded either wind or water - records conflict on which held which."
    'sign_outside_magic_shop': "Sage Relationships: Belenus approached all things as a philosopher; Enki, as a practitioner of magic. Their debates were legendary."
    'sign_death_mountain_cave_back': "Historical Record: Mierin was the first maiden captured by the wizard."
    'sign_east_of_links_house': "Familial Connections: The mountain hermit claims kinship with one of the missing maidens."
    'sign_south_of_lumberjacks': "Terminal Observation: Spirit and Time occupy adjacent positions at the sequence's conclusion."
    'sign_east_of_desert': "Hadah's Domain: Scholars note that Hadah's wrath was legendary—sudden as a lightning strike, and just as impossible to predict or contain"
