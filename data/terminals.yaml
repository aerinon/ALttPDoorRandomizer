# Terminal door definitions for pit/warp shuffle.
# 'name' must be unique — entries marked DUPLICATE need renaming.
# 'region' is the destination region in the world graph.
# 'sources' lists all source doors that land at this terminal when shuffled.
# 'rom' is the Phase 5 ROM data (dr_baserom docs/design/2026-06-01-pitwarp-generator-interface.md):
#   rows: the LandingZoneData rows the ROM reads when one of this entry's sources is used (fixed by the base ROM).
#   source_room: the room of this entry's sources, the room PitWarpLookupTable reads the rows for.
#   entrance: instead of rows, for a hole's Drop Portal fall: its EntranceData row (the overworld hole's entrance ID).
#   landing: RAM state right after landing at this terminal, written into the rows (or the entrance row) of whichever
#   source group lands here. Copied from pit_warp_data_manual.json (transitions, 'capture' label); the drop landings
#   have no capture and are decoded from their vanilla EntranceData rows.

